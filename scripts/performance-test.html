<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeTrack 效能測試 - 資料生成器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0a0a0a;
            color: #e0e0e0;
        }
        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        h1 { color: #C8B085; margin-top: 0; }
        button {
            background: #C8B085;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover { background: #D9C298; }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            color: #999;
        }
        #log {
            background: #0d0d0d;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #222;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            height: 300px;
            overflow-y: auto;
        }
        .log-line { margin: 4px 0; }
        .success { color: #4ade80; }
        .warning { color: #fbbf24; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
        .stats {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #C8B085;
        }
        .stats-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }
        .stats-label { color: #888; }
        .stats-value { color: #C8B085; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 TradeTrack 效能測試</h1>
        <p>此工具會生成 50,000 筆測試交易資料並注入到系統中。</p>
        
        <div style="margin: 20px 0;">
            <button id="btnGenerate" onclick="generateAndInject()">🚀 生成並注入 50,000 筆資料</button>
            <button id="btnRestore" onclick="restoreBackup()" disabled>♻️ 還原原始資料</button>
            <button id="btnClear" onclick="clearLog()">🗑️ 清除日誌</button>
        </div>

        <div id="stats" class="stats" style="display: none;">
            <div class="stats-item">
                <span class="stats-label">總筆數:</span>
                <span class="stats-value" id="statTotal">-</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">總損益:</span>
                <span class="stats-value" id="statPnL">-</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">勝率:</span>
                <span class="stats-value" id="statWinRate">-</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">資料大小:</span>
                <span class="stats-value" id="statSize">-</span>
            </div>
        </div>

        <div id="log"></div>
    </div>

    <script>
        const STRATEGIES = ['動能突破', '急殺抄底', '波段趨勢', '籌碼面', '技術面'];
        const EMOTIONS = ['短線', '事件', '產業', '波段', '隔日沖'];
        const PORTFOLIOS = ['main', 'portfolio-1', 'portfolio-2'];
        
        let backupData = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function randomDate() {
            const end = new Date();
            const start = new Date();
            start.setFullYear(start.getFullYear() - 2);
            const timestamp = start.getTime() + Math.random() * (end.getTime() - start.getTime());
            return new Date(timestamp).toISOString().split('T')[0];
        }

        function randomPnL() {
            const isProfit = Math.random() < 0.6;
            if (isProfit) {
                const base = Math.random() ** 2;
                return Math.floor(100 + base * 49900);
            } else {
                const base = Math.random() ** 2;
                return -Math.floor(50 + base * 29950);
            }
        }

        function generateTrade(index) {
            const date = randomDate();
            const pnl = randomPnL();
            
            return {
                id: `test-trade-${Date.now()}-${index}`,
                date,
                pnl,
                amount: String(Math.abs(pnl)),
                type: pnl >= 0 ? 'profit' : 'loss',
                strategy: STRATEGIES[Math.floor(Math.random() * STRATEGIES.length)],
                emotion: EMOTIONS[Math.floor(Math.random() * EMOTIONS.length)],
                portfolioId: PORTFOLIOS[Math.floor(Math.random() * PORTFOLIOS.length)],
                note: Math.random() > 0.7 ? `測試交易 ${index}` : '',
                timestamp: new Date(date).toISOString()
            };
        }

        async function generateAndInject() {
            const COUNT = 50000;
            const btnGenerate = document.getElementById('btnGenerate');
            const btnRestore = document.getElementById('btnRestore');
            
            btnGenerate.disabled = true;
            clearLog();
            
            try {
                // 1. 備份現有資料
                log('📦 備份現有資料...', 'info');
                backupData = {
                    trades: localStorage.getItem('local_trades'),
                    strategies: localStorage.getItem('local_strategies'),
                    emotions: localStorage.getItem('local_emotions'),
                    portfolios: localStorage.getItem('local_portfolios')
                };
                const backupSize = JSON.stringify(backupData).length;
                log(`✅ 備份完成 (${(backupSize / 1024).toFixed(2)} KB)`, 'success');
                
                // 2. 生成資料
                log(`🔄 開始生成 ${COUNT.toLocaleString()} 筆測試資料...`, 'info');
                const trades = [];
                const startTime = performance.now();
                
                for (let i = 0; i < COUNT; i++) {
                    trades.push(generateTrade(i));
                    
                    if ((i + 1) % 10000 === 0) {
                        log(`   已生成 ${(i + 1).toLocaleString()} 筆 (${((i + 1) / COUNT * 100).toFixed(1)}%)`, 'info');
                        await new Promise(resolve => setTimeout(resolve, 0)); // 讓UI更新
                    }
                }
                
                const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
                log(`✅ 資料生成完成 (耗時 ${elapsed}s)`, 'success');
                
                // 3. 排序
                log('🔄 排序資料...', 'info');
                trades.sort((a, b) => new Date(b.date) - new Date(a.date));
                log('✅ 排序完成', 'success');
                
                // 4. 計算統計
                const total = trades.reduce((sum, t) => sum + t.pnl, 0);
                const wins = trades.filter(t => t.pnl > 0).length;
                const winRate = (wins / trades.length * 100).toFixed(2);
                const dataSize = JSON.stringify(trades).length;
                
                // 顯示統計
                document.getElementById('stats').style.display = 'block';
                document.getElementById('statTotal').textContent = trades.length.toLocaleString();
                document.getElementById('statPnL').textContent = total.toLocaleString();
                document.getElementById('statWinRate').textContent = `${winRate}%`;
                document.getElementById('statSize').textContent = `${(dataSize / 1024 / 1024).toFixed(2)} MB`;
                
                log('📊 統計資訊:', 'info');
                log(`   總筆數: ${trades.length.toLocaleString()}`, 'info');
                log(`   總損益: ${total.toLocaleString()}`, 'info');
                log(`   勝率: ${winRate}%`, 'info');
                log(`   資料大小: ${(dataSize / 1024 / 1024).toFixed(2)} MB`, 'info');
                
                // 5. 注入到 localStorage
                log('💾 注入資料到 localStorage...', 'info');
                localStorage.setItem('local_trades', JSON.stringify(trades));
                log('✅ 注入完成', 'success');
                
                btnRestore.disabled = false;
                
                log('⚠️  即將在 3 秒後重新整理頁面以載入測試資料...', 'warning');
                setTimeout(() => {
                    window.location.href = 'http://localhost:5173/';
                }, 3000);
                
            } catch (error) {
                log(`❌ 錯誤: ${error.message}`, 'error');
                btnGenerate.disabled = false;
            }
        }

        function restoreBackup() {
            if (!backupData) {
                log('❌ 無備份資料可還原', 'error');
                return;
            }
            
            log('♻️  還原原始資料...', 'info');
            Object.entries(backupData).forEach(([key, value]) => {
                if (value) localStorage.setItem(key, value);
            });
            
            log('✅ 還原完成', 'success');
            log('⚠️  即將重新整理頁面...', 'warning');
            
            setTimeout(() => {
                window.location.href = 'http://localhost:5173/';
            }, 2000);
        }

        // 頁面載入時檢查是否有備份
        window.addEventListener('load', () => {
            const hasBackup = sessionStorage.getItem('hasBackup');
            if (hasBackup) {
                document.getElementById('btnRestore').disabled = false;
                log('ℹ️  偵測到備份資料，可使用還原功能', 'info');
            }
        });
    </script>
</body>
</html>
