[[services]]
name = "backend"
dir = "."
dockerfile = "backend/Dockerfile"
# port = 5000  # Zeabur 會自動偵測 EXPOSE 5000，這裡可以省略或顯式指定

[[services]]
name = "frontend"
dir = "."
type = "static"
build = "npm install && npm run build"
output = "dist"

# 依賴關係確保後端先啟動（雖然 Zeabur 的靜態前端不一定需要這個，但好習慣）
# [[services.dependencies]]
# frontend = ["backend"]
